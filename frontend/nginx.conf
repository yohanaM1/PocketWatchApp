# Serves the built app and proxies /api/* to the backend with the prefix stripped,
# the same as the Vite dev proxy in vite.config.ts. One origin, so no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API accepts CSVs up to 1,000,000 bytes; leave room for multipart overhead
    # so a valid upload never gets nginx's own 413 page.
    client_max_body_size 2m;

    location /api/ {
        # The trailing slash strips /api: /api/transactions -> /transactions.
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The agent's own budget is 20s.
        proxy_read_timeout 60s;
    }

    # Built assets have hashed file names, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is a client-side route (/ask, /transactions, ...): serve index.html,
    # never cached, so a new deploy is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
