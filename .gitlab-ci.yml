# Run on merge requests and on pushes to the default branch, without duplicate
# pipelines when a branch has an open MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# The instance runners only pick up jobs tagged for them.
default:
  tags: [docker]

# Always runs, so every MR gets a pipeline even before the backend and
# frontend exist.
ci-check:
  image: alpine:3.20
  script:
    - echo "CI is running for $CI_COMMIT_REF_NAME"

test:
  image: python:3.12
  # Skipped until the backend lands on this branch.
  rules:
    - exists: [backend/requirements.txt]
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: rootpass
    MYSQL_DATABASE: pocketwatch
    JWT_SECRET: ci-only-secret-not-for-production-0123456789
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    # No LLM_* variables: any accidental real LLM call ends as status `failed`.
  cache:
    key:
      files: [backend/requirements.txt]
    paths: [.cache/pip]
  before_script:
    - cd backend
    - pip install -r requirements.txt
    # Wait until MySQL accepts logins, and use whichever host does. On the course runners the
    # service may be on the host network at 127.0.0.1, and the "mysql" name can resolve even
    # when it points elsewhere (the alias is skipped when another service on the runner
    # already holds it), so a name lookup isn't enough to pick the host.
    - |
      python - <<'EOF'
      import time, pymysql
      for _ in range(60):
          for host in ("127.0.0.1", "mysql"):
              try:
                  pymysql.connect(host=host, user="root", password="rootpass", connect_timeout=2).close()
              except pymysql.err.OperationalError:
                  continue
              open("/tmp/db_host", "w").write(host)
              raise SystemExit(0)
          time.sleep(2)
      raise SystemExit("MySQL never became ready on 127.0.0.1 or mysql")
      EOF
    - export DB_HOST=$(cat /tmp/db_host)
    - echo "MySQL host is $DB_HOST"
    - export DATABASE_URL="mysql+pymysql://root:rootpass@$DB_HOST:3306/pocketwatch"
    - export TEST_DATABASE_URL="mysql+pymysql://root:rootpass@$DB_HOST:3306/pocketwatch_test"
  script:
    - alembic upgrade head          # catches broken migrations on an empty DB
    - alembic check                 # fails if models.py and the migrations have drifted apart
    - alembic downgrade base && alembic upgrade head
    - pytest -q

frontend:
  image: node:20
  # Skipped until the frontend lands on this branch.
  rules:
    - exists: [frontend/package.json]
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.cache/npm]
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run typecheck             # tsc --noEmit
    - npm run lint                  # eslint, including react/no-danger
    - npm test -- --run             # vitest, jsdom, no network
    - npm run build
